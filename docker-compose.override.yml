services:
  team4sv30-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >-
      /bin/sh -c "go run ./cmd/migrate up -dir /app/database/migrations && exec air -c .air.toml"
    environment:
      CGO_ENABLED: "0"
    volumes:
      - backend_go_build:/root/.cache/go-build
      # Several backend contract tests resolve repository migrations from the
      # repository root rather than the runtime /app path.
      - ./database/migrations:/database/migrations:ro
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - go.mod
            - go.sum
            - Dockerfile
            - Dockerfile.dev
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/Dockerfile.dev

  team4sv30-frontend:
    command: npm run dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - ./media:/media

volumes:
  backend_go_build:
  frontend_node_modules:
  frontend_next:
