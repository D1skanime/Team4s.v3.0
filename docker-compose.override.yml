services:
  team4sv30-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >-
      /bin/sh -c "go run ./cmd/migrate up -dir /app/database/migrations && exec air -c .air.toml"
    environment:
      CGO_ENABLED: "0"
    volumes:
      - backend_go_build:/root/.cache/go-build
      # Several backend contract tests resolve repository migrations from the
      # repository root rather than the runtime /app path.
      - ./database/migrations:/database/migrations:ro
      # Phase 134-03: the verification matrix reads the checked-in fixture
      # manifest (scripts/member-profile-fixture.manifest.json) via a
      # repository-root-relative path ("../../../scripts/..." from
      # backend/internal/repository), mirroring the migrations mount above.
      - ./scripts:/scripts:ro
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - go.mod
            - go.sum
            - Dockerfile
            - Dockerfile.dev
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/Dockerfile.dev

  team4sv30-frontend:
    # Turbopack accumulated almost 3 GB of heap and terminated the local
    # frontend after longer test sessions. Webpack is slower on the first
    # compile, but keeps the Docker development server stable.
    command: npm run dev -- --webpack
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - ./backend:/backend:ro
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      # Repository-owned test contracts referenced relative to /app.
      - ./docs:/docs:ro
      - ./.planning:/.planning:ro
      - ./infra:/infra:ro
      - ./media:/media

volumes:
  backend_go_build:
  frontend_node_modules:
  frontend_next:
