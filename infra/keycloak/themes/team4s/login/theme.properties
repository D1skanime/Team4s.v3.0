parent=keycloak.v2
import=common/keycloak

# theme.properties `styles=` fully replaces (does not merge with) the
# parent's own `styles=` value - verified live against Keycloak 26. The one
# layout-critical rule this drops from keycloak.v2's own styles.css is
# reproduced directly in css/login.css (see its header comment); Keycloak's
# own background/logo image assets are intentionally not copied.
styles=css/login.css

# Isolated stale-field-validation repair (D-22). Removes only the edited
# field's own stale server error + aria-invalid on input, leaving sibling
# field errors and the next authoritative server response untouched. See
# resources/js/registration-validation.js for the extractable behavior and
# frontend/src/lib/keycloakRegistrationValidation.test.ts for jsdom coverage.
scripts=js/registration-validation.js

# Team4s currently only ships German copy (D-21); the realm restricts
# supportedLocales to ["de"] so no language switcher is shown.
locales=de
