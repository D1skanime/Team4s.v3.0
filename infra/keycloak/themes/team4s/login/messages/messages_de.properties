# Team4s German copy overlay (D-21).
#
# Keycloak already ships a complete, professionally reviewed German
# translation for the built-in login/registration/reset flows (theme/base/
# login/messages/messages_de.properties, inherited via parent=keycloak.v2).
# Enabling realm internationalization with defaultLocale=de is what makes
# that translation active; this file intentionally stays a thin override
# seam and does not duplicate strings that are already correct in German.
#
# Do not add password-requirement copy here: no password policy is active
# locally (D-11), and Keycloak's own client-side policy list renders empty
# in that case. Do not add or imply an "email verified" claim: email
# verification is not enforced locally (D-14).

# Stock Keycloak brands the login page via loginTitle="Anmeldung bei {0}"
# (interpolates the realm display name) but registerTitle has no such
# placeholder, so the registration page otherwise shows just "Registrierung"
# with no Team4s branding at all. Fix that one asymmetry explicitly.
registerTitle=Team4s-Konto registrieren

# Plan 135-08 (D-12/D-13): shown only on the register.ftl override when an
# invited email was found (see register.ftl's file header for the
# login_hint -> "username" attribute mechanism). Keycloak does not forward
# the inviting group/inviter/role to the registration template, so this is
# intentionally generic rather than naming them.
team4sInviteContext=Du erstellst ein Konto, um eine Team4s-Einladung anzunehmen. Danach wirst du automatisch zur Einladung zurückgeleitet.

# Helper text shown directly under the D-12 locked/prefilled email field.
team4sEmailLockedHelp=Diese E-Mail-Adresse stammt aus deiner Einladung und kann hier nicht geändert werden.

# Phase 135-09: Fansubname als KC-Username (D-14)
fansubName=Fansubname
invalidFansubNameMessage=Der Fansubname darf nur Buchstaben, Ziffern, Leerzeichen sowie Punkt, Bindestrich und Unterstrich enthalten.
