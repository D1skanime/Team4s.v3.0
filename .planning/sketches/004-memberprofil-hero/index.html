<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phase 120 – beruhigter Memberprofil-Hero</title>
  <link rel="stylesheet" href="../themes/default.css">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#e9eef7;color:var(--color-text);font-family:var(--font-sans);padding-top:58px}
    button,select{font:inherit}.variant-nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;gap:8px;padding:10px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid #cbd5e1;box-shadow:0 4px 18px #23355716}
    .variant-tab{border:1px solid #c5d0e4;border-radius:8px;background:#f8fafc;padding:8px 13px;color:#45516a;font-weight:750;cursor:pointer}.variant-tab.active{background:#263d69;color:#fff;border-color:#263d69}
    .variant{display:none}.variant.active{display:block}.viewport{width:min(1480px,calc(100% - 40px));margin:26px auto 60px;transition:max-width .2s ease}.shell{min-height:840px;border:1px solid #cbd5e1;background:#f7f9fd;box-shadow:0 22px 60px #21345b20}
    .appbar{height:60px;display:flex;align-items:center;padding:0 28px;background:#1e3157;color:white;font-weight:850;letter-spacing:.02em}.page{padding:24px 32px 52px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px;color:#667085;font-size:14px}.crumbs{display:flex;gap:8px;align-items:center}.actions{display:flex;gap:8px}.quiet-button{border:1px solid #c9d3e3;border-radius:8px;background:rgba(255,255,255,.78);padding:8px 11px;color:#46536c;font-weight:700;cursor:pointer}.quiet-button:hover{background:#fff;border-color:#91a6cc}
    .hero{position:relative;isolation:isolate;min-height:230px;display:grid;grid-template-columns:140px minmax(0,1fr);align-items:end;gap:24px;overflow:hidden;border:1px solid #8fa0bd;border-radius:12px;padding:30px;color:white;box-shadow:0 14px 34px #26395a24}
    .hero:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--hero-image);background-size:cover;background-position:center;filter:saturate(.92)}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(13,20,35,.4)}
    .avatar{width:140px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#c7d4ec,#637ba8);border:4px solid #ffffffc7;box-shadow:0 10px 30px #111a2d66;font-size:45px;font-weight:900}.copy{display:grid;gap:10px;align-content:end;max-width:800px;text-shadow:0 2px 8px rgba(4,9,18,.88)}.eyebrow{margin:0;color:#eef3fb;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:850}.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title{margin:0;font-size:38px;line-height:1.05}.verified,.status{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850;text-shadow:none}.verified{background:#365da9e8}.status{background:#e3f2e8;color:#17482c}.points{width:max-content;display:flex;align-items:baseline;gap:7px;padding:7px 11px;border:1px solid #ffffff52;border-radius:8px;background:#101c3299;box-shadow:0 4px 12px #050a1352;text-shadow:none}.points strong{font-size:20px}.points span{font-size:12px;color:#edf2fa;font-weight:750}.bio{margin:0;color:#f2f5fa;line-height:1.5}.meta{color:#edf2fa;font-size:14px;font-weight:700}
    .below{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.card{min-height:180px;padding:22px;border:1px solid #d4dbe8;border-radius:10px;background:white}.card h2{margin:0 0 10px;font-size:21px}.card p{color:#667085;line-height:1.5}
    .variant-b .hero{grid-template-columns:125px minmax(0,1fr);min-height:218px;padding:26px}.variant-b .hero:after{background:linear-gradient(90deg,rgba(13,20,35,.64),rgba(13,20,35,.46) 58%,rgba(13,20,35,.18))}.variant-b .avatar{width:125px}.variant-b .title{font-size:35px}
    .variant-c .hero{min-height:190px;grid-template-columns:104px minmax(0,1fr);padding:24px}.variant-c .hero:before{filter:saturate(.86)}.variant-c .hero:after{background:rgba(13,20,35,.5)}.variant-c .avatar{width:104px}.variant-c .title{font-size:32px}.variant-c .copy{gap:8px}.variant-c .bio{max-width:650px}
    .tools{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:8px;background:#111827d9;color:#fff;font-size:12px;opacity:.45;transition:opacity .2s}.tools:hover{opacity:1}.tools button,.tools select{border:1px solid #ffffff3a;border-radius:5px;background:#263247;color:#fff;padding:5px;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:24px;z-index:40;transform:translate(-50%,20px);padding:10px 15px;border-radius:8px;background:#17233c;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .image-switcher{position:fixed;left:50%;top:62px;z-index:30;display:flex;gap:7px;align-items:center;transform:translateX(-50%);padding:7px 9px;border-radius:8px;background:#111827ed;color:#fff;font-size:12px;box-shadow:0 8px 20px #11182738}.image-switcher button{border:1px solid #ffffff3a;border-radius:5px;background:#263247;color:#fff;padding:6px 8px;cursor:pointer}.image-switcher button.active{background:#fff;color:#17233c;border-color:#fff}
    @media(max-width:700px){body{padding-top:104px}.variant-nav{overflow:auto}.variant-tab{white-space:nowrap}.image-switcher{top:58px;width:calc(100% - 16px);justify-content:center}.viewport{width:min(100% - 20px,420px)}.page{padding:16px 12px 36px}.toolbar{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap}.hero,.variant-b .hero,.variant-c .hero{min-height:0;grid-template-columns:100px minmax(0,1fr);align-items:center;padding:18px;gap:16px}.avatar,.variant-b .avatar,.variant-c .avatar{width:100px}.title,.variant-b .title,.variant-c .title{font-size:27px}.eyebrow,.bio{grid-column:1/-1}.copy{display:contents}.title-row{align-self:end}.points{align-self:start}.meta{grid-column:1/-1}.below{grid-template-columns:1fr}.tools{right:8px;bottom:8px}.tools span{display:none}}
  </style>
</head>
<body>
  <nav class="variant-nav" aria-label="Varianten">
    <button class="variant-tab active" data-variant="a">A: Sanfte Vollfläche</button>
    <button class="variant-tab" data-variant="b">B: Lokale Lesbarkeitszone ★ Gewählt</button>
    <button class="variant-tab" data-variant="c">C: Kompakt editorial</button>
  </nav>
  <div class="image-switcher"><strong>Testbild:</strong><button data-scene="dark">Dunkel</button><button data-scene="light">Hell</button></div>
  <div id="viewport" class="viewport" data-scene="dark"></div>
  <div class="tools"><span>Ansicht</span><button data-width="375px">Mobil</button><button data-width="768px">Tablet</button><button data-width="1480px">Desktop</button></div>
  <div id="toast" class="toast">Aktion im Sketch ausgelöst</div>
  <script>
    const variants={
      a:{label:'Sanfte Vollfläche',description:'Das persönliche Hintergrundbild bleibt über die ganze Fläche erkennbar, aber deutlich entsättigt und abgedunkelt.'},
      b:{label:'Lokale Lesbarkeitszone',description:'Ein weicher zusätzlicher Scrim liegt nur hinter den Informationen; Bild und Zuschnitt bleiben über die gesamte Fläche erhalten.'},
      c:{label:'Kompakt editorial',description:'Weniger Höhe und kleinere Bildanteile schaffen einen sachlicheren, besonders scanbaren Profilauftakt.'}
    };
    const viewport=document.getElementById('viewport');let current='b';let scene='dark';
    function markup(key){const v=variants[key];return `<div class="variant variant-${key} active"><div class="shell"><div class="appbar">TEAM4S · MEMBERPROFIL</div><main class="page"><div class="toolbar"><div class="crumbs"><span>Anime</span><span>›</span><span>Members</span><span>›</span><strong>Akuma</strong></div><div class="actions"><button class="quiet-button">Profil bearbeiten</button><button class="quiet-button">Korrektur melden</button></div></div><section class="hero"><div class="avatar" aria-label="Avatar">AK</div><div class="copy"><p class="eyebrow">Fansub-Member · ${v.label}</p><div class="title-row"><h1 class="title">Akuma</h1><span class="verified">✓ Verifiziert</span><span class="status">Aktiv</span></div><div class="points"><strong>2.840</strong><span>Punkte</span></div><p class="bio">Timing, Typesetting und Qualitätssicherung mit einem Blick für ruhige, lesbare Releases.</p><span class="meta">Aktuell aktiv seit 2016 · Schwerpunkte: Timing, Typesetting</span></div></section><div class="below"><section class="card"><h2>Fansub-Geschichte</h2><p>${v.description}</p></section><section class="card"><h2>Gruppenzugehörigkeit</h2><p>Die nachfolgenden Bereiche dienen als Maßstab für Breite und Abschnittsrhythmus.</p></section></div></main></div></div>`}
    function applyScene(){viewport.style.setProperty('--hero-image',`url('assets/anime-${scene}.png')`);viewport.dataset.scene=scene;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene))}
    function show(key){current=key;viewport.innerHTML=markup(key);document.querySelectorAll('.variant-tab').forEach(b=>b.classList.toggle('active',b.dataset.variant===key));applyScene();bindActions()}
    function bindActions(){document.querySelectorAll('.quiet-button').forEach(b=>b.onclick=()=>{const t=document.getElementById('toast');t.textContent=`„${b.textContent}“ bleibt bewusst zurückhaltend`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)})}
    document.querySelectorAll('.variant-tab').forEach(b=>b.onclick=()=>show(b.dataset.variant));document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>viewport.style.maxWidth=b.dataset.width);document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;applyScene()});show('b');
  </script>
</body>
</html>
