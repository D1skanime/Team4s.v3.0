<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sketch 004 – Memberprofil Hero und Abschnittsrhythmus</title><link rel="stylesheet" href="../themes/default.css"><style>
*{box-sizing:border-box}body{margin:0;padding-top:58px;background:#e8edf6;color:#1c2333;font-family:var(--font-sans)}button{font:inherit}.tabs{position:fixed;inset:0 0 auto;z-index:20;display:flex;gap:8px;padding:10px 16px;overflow:auto;background:#fff;border-bottom:1px solid #ccd5e5}.tab{white-space:nowrap;padding:8px 12px;border:1px solid #c7d1e2;border-radius:8px;background:#f8fafc;color:#46536a;font-weight:800;cursor:pointer}.tab.active{background:#253b66;color:#fff}.viewport{container:profile/inline-size;width:min(1480px,calc(100% - 40px));margin:24px auto 60px;transition:max-width .2s}.shell{overflow:hidden;background:#f8f9fc;border:1px solid #cbd5e1;box-shadow:0 20px 55px #26395b22}.appbar{padding:20px 28px;background:#20365f;color:#fff;font-weight:900}.page{--section-gap:46px;--card-gap:20px;--section-pad:0;padding:24px 30px 56px}.toolbar{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px;color:#667085;font-size:14px}.actions{display:flex;gap:8px}.actions button{padding:7px 10px;border:1px solid #ccd5e4;border-radius:7px;background:#fff;color:#4c5870}.hero{position:relative;min-height:205px;display:grid;grid-template-columns:110px 1fr;align-items:end;gap:20px;overflow:hidden;padding:25px;border-radius:12px;color:#fff;background-image:linear-gradient(90deg,rgba(13,20,35,.64),rgba(13,20,35,.45) 58%,rgba(13,20,35,.18)),url('assets/hero.png');background-size:cover;background-position:center}.avatar{width:110px;aspect-ratio:1;display:grid;place-items:center;border:4px solid #fff;border-radius:50%;background:#8fa5ce;font-size:38px;font-weight:900}.hero h1{margin:0;font-size:34px}.heroCopy{display:grid;gap:8px;text-shadow:0 2px 8px #08101b}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:4px 8px;border-radius:999px;background:#fff;color:#28416d;font-size:12px;font-weight:850}.section{margin-top:var(--section-gap);padding:var(--section-pad)}.sectionHead{margin-bottom:16px}.sectionHead h2{margin:0;font-size:24px;line-height:1.2}.wine{width:100%;height:2px;margin-top:10px;background:#82122c}.sectionHead p{margin:9px 0 0;color:#667085}.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--card-gap)}.card{padding:20px;border:1px solid #d2d9e6;border-radius:10px;background:#fff;box-shadow:0 3px 12px #26395a0d}.card h3{margin:0 0 9px;font-size:18px}.card p{margin:0;color:#667085;line-height:1.55}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.project{min-height:140px;background:linear-gradient(145deg,#263e6b,#526f9e);color:#fff}.project p{color:#e1e8f4}.collections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.collection{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;min-height:155px}.mainBadge{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 10px #1b27402c)}.collection h3{margin:0 0 5px;font-size:17px}.progress{height:7px;margin:10px 0 7px;border-radius:99px;background:#e2e7f0;overflow:hidden}.progress span{display:block;width:68%;height:100%;background:linear-gradient(90deg,#4e73bd,#82122c)}.miniBadges{display:flex;gap:5px}.miniBadges img{width:35px;height:35px;object-fit:contain}.contrib{min-height:130px}.variant-b .page{--section-gap:28px;--card-gap:14px}.variant-b .sectionHead{margin-bottom:11px}.variant-b .sectionHead h2{font-size:21px}.variant-b .wine{margin-top:7px}.variant-b .card{padding:16px}.variant-b .collection{min-height:135px}.variant-c .page{--section-gap:36px;--card-gap:18px;padding-inline:0}.variant-c .toolbar,.variant-c .hero{margin-inline:30px}.variant-c .section{padding:28px 30px;margin-top:18px}.variant-c .section:nth-of-type(even){background:linear-gradient(90deg,#edf1f8,#f7f8fb 55%,#edf1f8);border-block:1px solid #d7deea}.tools{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;gap:5px;padding:8px;border-radius:8px;background:#101827dd;color:#fff;opacity:.55}.tools:hover{opacity:1}.tools button{padding:5px;border:1px solid #ffffff3a;border-radius:5px;background:#27334a;color:#fff;cursor:pointer}
.hero{isolation:isolate;min-height:230px;grid-template-columns:140px minmax(0,1fr);gap:24px;padding:30px;border:1px solid #8fa0bd;box-shadow:0 14px 34px #26395a24;background:none}.hero:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--hero-image);background-size:cover;background-position:center;filter:saturate(.92)}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(13,20,35,.64),rgba(13,20,35,.46) 58%,rgba(13,20,35,.18))}.avatar{width:140px;border-color:#ffffffc7;background:linear-gradient(145deg,#c7d4ec,#637ba8);box-shadow:0 10px 30px #111a2d66;font-size:45px}.hero h1{font-size:38px;line-height:1.05}.heroCopy{gap:10px;max-width:800px}.eyebrow{margin:0;color:#eef3fb;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:850}.titleRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.points{width:max-content;padding:7px 11px;border:1px solid #ffffff52;border-radius:8px;background:#101c3299;text-shadow:none}.points strong{font-size:20px}.points span{margin-left:7px;font-size:12px}.heroBio{margin:0;color:#f2f5fa;line-height:1.5}.heroMeta{color:#edf2fa;font-size:14px;font-weight:700}
@container profile (max-width:700px){.page{padding:14px 12px 36px!important}.toolbar{flex-direction:column}.actions{flex-wrap:wrap}.hero{min-height:0;grid-template-columns:1fr;align-items:start;padding:18px}.avatar{width:100px}.heroCopy{min-width:0;max-width:100%}.hero h1{font-size:27px}.heroBio,.heroMeta,.eyebrow{overflow-wrap:anywhere}.pair,.projects,.collections{grid-template-columns:1fr}.collection{grid-template-columns:78px 1fr;min-height:0}.mainBadge{width:78px;height:78px}.variant-c .toolbar,.variant-c .hero{margin-inline:0}.variant-c .section{padding:22px 12px}.section{margin-top:30px}.sectionHead h2{font-size:21px}}
</style></head><body><nav class="tabs"><button class="tab" data-v="a">A: Großzügiger Rhythmus</button><button class="tab" data-v="b">B: Kompakter Rhythmus</button><button class="tab active" data-v="c">C: Hintergrundbänder ★ Gewählt</button></nav><div id="viewport" class="viewport"></div><div class="tools"><button data-w="390px">Mobil</button><button data-w="820px">Tablet</button><button data-w="1480px">Desktop</button></div><script>
const badges={role:'assets/role-timer-motif.png',rank:'assets/rank-frame-timer-silver.png',points:'assets/point_milestone_experienced-v2.png',veteran:'assets/point_milestone_veteran-v3.png',first:'assets/progress-first_contribution-motif.png',productive:'assets/progress-productive-motif.png',projects:'assets/contribution_projects_silver-v2.png',chronicle:'assets/contribution_chronicle_bronze-v4.png',member:'assets/membership-long_term_member-v4.png',special:'assets/special-historical_leader-v1.png'};const viewport=document.getElementById('viewport');
function collection(title,img,copy,mini){return `<article class="card collection"><img class="mainBadge" src="${img}" alt=""><div><h3>${title}</h3><p>${copy}</p><div class="progress"><span></span></div><div class="miniBadges">${mini.map(x=>`<img src="${x}" alt="">`).join('')}</div></div></article>`}
function section(title,desc,content){return `<section class="section"><header class="sectionHead"><h2>${title}</h2><div class="wine"></div>${desc?`<p>${desc}</p>`:''}</header>${content}</section>`}
function page(v){return `<div class="shell variant-${v}"><div class="appbar">TEAM4S · MEMBERPROFIL</div><main class="page"><div class="toolbar"><span>Anime › Members › <strong>Akuma</strong></span><div class="actions"><button>Profil bearbeiten</button><button>•••</button></div></div><header class="hero"><div class="avatar">AK</div><div class="heroCopy"><small>FANSUB-MEMBER</small><h1>Akuma</h1><div class="pills"><span class="pill">✓ Verifiziert</span><span class="pill">Aktiv</span><span class="pill">2.840 Punkte</span></div><span>Timing, Typesetting und Qualitätssicherung</span></div></header>${section('Profil und Mitgliedschaft','Persönliche Einordnung und Gruppenweg.',`<div class="pair"><article class="card"><h3>Fansub-Geschichte</h3><p>Seit 2016 aktiv und bekannt für präzises Timing sowie ruhiges Typesetting.</p></article><article class="card"><h3>Gruppenzugehörigkeit</h3><p>Tsuki no Fansubs · aktiv seit 2018<br>Hikari Subs · 2016–2018</p></article></div>`)}${section('Aktuelle Projekte','Projekte bleiben als visueller Schwerpunkt vollbreit.',`<div class="projects"><article class="card project"><h3>Frieren</h3><p>Timing · 24 Folgen</p></article><article class="card project"><h3>Apothecary Diaries</h3><p>Typesetting · 12 Folgen</p></article><article class="card project"><h3>Violet Evergarden</h3><p>Qualitätssicherung</p></article></div>`)}${section('Auszeichnungen','Die aktuellen Sammlungskarten aus Phase 118 und 119 bleiben inhaltlich gleich.',`<div class="collections">${collection('Rolle: Timer',badges.role,'50 von 108 · Noch 58 bis Silber',[badges.role,badges.rank])}${collection('Fortschritt',badges.productive,'25 Anime-Projekte · Nächstes Ziel: 50',[badges.first,badges.productive])}${collection('Punkte-Meilensteine',badges.points,'2.840 Punkte · Veteran erreicht',[badges.points,badges.veteran])}${collection('Mitgetragene Projekte',badges.projects,'Silber · 80 Beiträge',[badges.projects])}${collection('Chronikpflege',badges.chronicle,'Bronze · 14 Beiträge',[badges.chronicle])}${collection('Mitgliedschaft',badges.member,'7 Jahre Mitglied',[badges.member,badges.special])}</div>`)}${section('Beiträge','Aktuelle und frühere Beiträge bilden das zweite Desktop-Paar.',`<div class="pair"><article class="card contrib"><h3>Aktuelle Beiträge</h3><p>Timing für Folge 12 bestätigt · vor 2 Tagen<br>Typesetting aktualisiert · vor 5 Tagen</p></article><article class="card contrib"><h3>Frühere Beiträge</h3><p>142 bestätigte Beiträge aus 18 Projekten.</p></article></div>`)}</main></div>`}
let scene='dark';function enhanceHero(){viewport.style.setProperty('--hero-image',`url('assets/anime-${scene}.png')`);const copy=viewport.querySelector('.heroCopy');if(copy)copy.innerHTML='<p class="eyebrow">Fansub-Member</p><div class="titleRow"><h1>Akuma</h1><span class="pill">✓ Verifiziert</span><span class="pill">Aktiv</span></div><div class="points"><strong>2.840</strong><span>Punkte</span></div><p class="heroBio">Timing, Typesetting und Qualitätssicherung mit einem Blick für ruhige, lesbare Releases.</p><span class="heroMeta">Aktuell aktiv seit 2016 · Schwerpunkte: Timing, Typesetting</span>'}function show(v){viewport.innerHTML=page(v);enhanceHero();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>viewport.style.maxWidth=b.dataset.w);const tools=document.querySelector('.tools');['dark','light'].forEach(value=>{const button=document.createElement('button');button.textContent=value==='dark'?'Dunkler BG':'Heller BG';button.onclick=()=>{scene=value;enhanceHero()};tools.prepend(button)});show('c');
</script></body></html>
