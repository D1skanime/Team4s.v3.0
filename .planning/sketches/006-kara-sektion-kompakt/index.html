<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSD Sketch 006 · Kara-Sektion</title>
  <link rel="stylesheet" href="../themes/default.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg,#eef3fb 0%,#e6edf9 48%,#f5f1ee 100%); color:var(--color-text); font:14px/1.45 var(--font-sans); }
    .variant-nav { position:sticky; top:0; z-index:5; display:flex; gap:8px; padding:10px 18px; background:rgba(24,32,54,.94); box-shadow:0 5px 18px rgba(19,31,60,.18); }
    .variant-tab,.tool button { border:1px solid rgba(255,255,255,.24); border-radius:8px; padding:8px 12px; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; transition:all .15s ease; }
    .variant-tab:hover,.variant-tab.active,.tool button:hover { background:#4772c5; border-color:#9fc1ff; }
    .variant { max-width:1260px; margin:30px auto; padding:0 20px 80px; }
    .section { border:1px solid rgba(255,255,255,.8); border-radius:20px; padding:26px 30px 30px; background:rgba(250,252,255,.72); box-shadow:0 18px 50px rgba(46,72,122,.16); backdrop-filter:blur(18px); }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:18px; border-bottom:2px solid #8c2341; padding-bottom:14px; margin-bottom:22px; }
    h1,h2,h3,p { margin:0; } h2 { font-size:22px; } h3 { font-size:16px; }
    .head-meta { display:flex; gap:7px; flex-wrap:wrap; color:#63708a; font-size:12px; }
    .pill { display:inline-flex; align-items:center; gap:5px; border:1px solid #c6d3ea; border-radius:999px; padding:4px 9px; background:#f8fbff; font-weight:700; }
    .timeline { display:grid; gap:8px; margin-bottom:22px; }
    .timeline-labels { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; color:#68738a; font-size:12px; font-variant-numeric:tabular-nums; }
    .timeline-labels div:nth-child(2) { text-align:center; color:#202b40; font-weight:700; }
    .timeline-labels div:last-child { text-align:right; }
    .track { position:relative; height:40px; padding-top:14px; }
    .track::before { content:""; position:absolute; inset:14px 0 auto; height:10px; border:1px solid #c5d2e8; border-radius:99px; background:#e4ebf5; }
    .segment { position:absolute; top:10px; height:18px; border-radius:99px; box-shadow:0 2px 8px rgba(20,30,50,.18); cursor:pointer; transition:transform .15s ease,filter .15s ease; }
    .segment:hover { transform:scaleY(1.2); filter:brightness(1.08); }
    .op { background:#2fa56f; } .insert { background:#8950c6; } .ed { background:#3199c9; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .card { position:relative; display:grid; gap:12px; min-width:0; padding:16px; border:1px solid color-mix(in srgb,var(--tone) 34%,transparent); border-left:4px solid var(--tone); border-radius:12px; background:color-mix(in srgb,var(--wash) 70%,rgba(255,255,255,.68)); box-shadow:0 8px 20px rgba(20,31,56,.08); transition:all .15s ease; }
    .card.selected { border-color:#4772c5; box-shadow:0 0 0 3px rgba(71,114,197,.2),0 12px 24px rgba(36,65,123,.14); transform:translateY(-2px); }
    .card.op-card { --tone:#15955a; --wash:rgba(21,149,90,.14); } .card.insert-card { --tone:#8442c7; --wash:rgba(132,66,199,.14); } .card.ed-card { --tone:#1685bf; --wash:rgba(22,133,191,.14); }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .type { width:max-content; border:1px solid color-mix(in srgb,var(--tone) 38%,transparent); border-radius:8px; padding:4px 9px; color:var(--tone); font-size:12px; font-weight:800; }
    .more { border:0; background:transparent; color:#5571a1; cursor:pointer; font-size:12px; font-weight:700; }
    .name { font-size:17px; font-weight:800; }
    .time { display:flex; gap:16px; color:#606d85; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
    .repeat { padding:6px 8px; border-radius:7px; background:rgba(255,255,255,.62); color:#5a6d8f; font-size:12px; font-weight:700; }
    .roles { color:#647089; font-size:12px; min-height:18px; }
    .roles.collapsed { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .play { min-height:42px; border:1px solid #315798; border-radius:8px; background:linear-gradient(#6f98ee,#416bc3); color:white; font-weight:800; cursor:pointer; transition:all .15s ease; }
    .play:hover { filter:brightness(1.08); transform:translateY(-1px); } .play.playing { background:linear-gradient(#39a878,#25885e); border-color:#1f7651; }
    .hint { display:flex; gap:8px; align-items:center; margin-top:18px; color:#66728a; font-size:12px; }
    .compact .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } .compact .card { grid-template-columns:1fr auto; align-items:center; gap:8px 14px; } .compact .card-top,.compact .name,.compact .time,.compact .roles,.compact .repeat { grid-column:1; } .compact .play { grid-column:2; grid-row:1 / span 5; min-width:126px; }
    .compact .roles { min-height:0; } .compact .repeat { width:max-content; }
    .tool { position:fixed; right:12px; bottom:12px; z-index:9; display:flex; gap:5px; align-items:center; padding:8px; border-radius:9px; background:rgba(15,24,45,.84); color:white; font-size:12px; opacity:.72; transition:opacity .2s; } .tool:hover { opacity:1; } .tool button { padding:5px 8px; font-size:11px; }
    .mobile .variant { max-width:420px; } .mobile .section { padding:20px 16px; } .mobile .cards,.mobile .compact .cards { grid-template-columns:1fr; } .mobile .card,.mobile .compact .card { grid-template-columns:1fr; } .mobile .compact .play { grid-column:1; grid-row:auto; width:100%; }
    @media (max-width:850px) { .cards,.compact .cards { grid-template-columns:repeat(2,minmax(0,1fr)); } .compact .card { grid-template-columns:1fr; } .compact .play { grid-column:1; grid-row:auto; width:100%; } }
    @media (max-width:560px) { .variant { margin:18px auto; padding:0 10px 70px; } .section { padding:20px 16px; } .cards,.compact .cards { grid-template-columns:1fr; } .head-meta { display:none; } }
  </style>
</head>
<body>
  <nav class="variant-nav"><button class="variant-tab active" data-variant="a">A: Timeline-Fokus</button><button class="variant-tab" data-variant="b">B: Kompakte Karten</button></nav>
  <main id="variant-a" class="variant">
    <section class="section">
      <header class="section-head"><div><h2>Karas</h2><p class="hint">Opening, Insert und Ending der Episode</p></div><div class="head-meta"><span class="pill">3 Karas</span><span class="pill">1 OP · 1 Insert · 1 ED</span></div></header>
      <!--TIMELINE-->
      <!--CARDS-A-->
      <p class="hint">Tipp: Eine Kara anklicken, um sie in der Timeline hervorzuheben.</p>
    </section>
  </main>
  <main id="variant-b" class="variant compact" style="display:none">
    <section class="section">
      <header class="section-head"><div><h2>Karas</h2><p class="hint">Mehr Übersicht, Aktion direkt an der Karte</p></div><div class="head-meta"><span class="pill">3 Einträge</span></div></header>
      <!--TIMELINE-->
      <!--CARDS-B-->
    </section>
  </main>
  <div class="tool"><span>Sketch</span><button data-size="desktop">Desktop</button><button data-size="mobile">Mobile</button></div>
  <script>
    const timeline = '<div class="timeline"><div class="timeline-labels"><div>Start<br><b>00:00</b></div><div>Gesamte Episode<br><b>24:00</b></div><div>Ende<br><b>24:00</b></div></div><div class="track"><span class="segment op" style="left:3%;width:7%" data-card="0"></span><span class="segment insert" style="left:43%;width:5%" data-card="1"></span><span class="segment ed" style="left:93%;width:7%" data-card="2"></span></div></div>';
    function card(type,name,time,duration,cls,color,roles,repeat='') { return `<article class="card ${cls}" data-card="${color}"><div class="card-top"><span class="type">${type}</span><button class="more" type="button">Details⌄</button></div><div class="name">${name}</div><div class="time"><span>${time}</span><span>Dauer ${duration}</span></div>${repeat ? `<div class="repeat">↻ ${repeat}</div>` : ''}<div class="roles collapsed">${roles}</div><button class="play" type="button">▷ Kara abspielen</button></article>`; }
    const cardsA = `<div class="cards">${card('Opening','Buddy Opening Lied','00:42–02:22','01:40','op-card','op','Desi · Qc · Type · timer · Über')}${card('Insert','test','10:22–11:25','01:03','insert-card','insert','Desi · Qc · Type · timer · Über')}${card('Ending','Buddy Ending','22:25–24:00','01:35','ed-card','ed','Desi · Qc · Type · timer · Über','Gilt auch für Folge 1–3')}</div>`;
    const cardsB = `<div class="cards">${card('Opening','Buddy Opening Lied','00:42–02:22','01:40','op-card','op','7 Beteiligte anzeigen')}${card('Insert','test','10:22–11:25','01:03','insert-card','insert','7 Beteiligte anzeigen')}${card('Ending','Buddy Ending','22:25–24:00','01:35','ed-card','ed','7 Beteiligte anzeigen','Folge 1–3')}</div>`;
    document.querySelectorAll('.variant').forEach((v,index) => { v.innerHTML = v.innerHTML.replace('<!--TIMELINE-->', timeline).replace(index === 0 ? '<!--CARDS-A-->' : '<!--CARDS-B-->', index === 0 ? cardsA : cardsB); });
    document.querySelectorAll('.card').forEach(card => card.addEventListener('click', e => { if (e.target.matches('.play')) { e.target.classList.toggle('playing'); e.target.textContent = e.target.classList.contains('playing') ? '■ Wiedergabe aktiv' : '▷ Kara abspielen'; } if (e.target.matches('.more')) card.querySelector('.roles').classList.toggle('collapsed'); card.classList.add('selected'); }));
    document.querySelectorAll('.segment').forEach(segment => segment.addEventListener('click', () => { document.querySelectorAll('.card').forEach(c => c.classList.remove('selected')); const card = document.querySelectorAll('.card')[Number(segment.dataset.card)]; if (card) card.classList.add('selected'); }));
    document.querySelectorAll('.variant-tab').forEach(tab => tab.addEventListener('click', () => { document.querySelectorAll('.variant').forEach(v => v.style.display = 'none'); document.querySelector('#variant-' + tab.dataset.variant).style.display = 'block'; document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); }));
    document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => { document.body.classList.toggle('mobile', button.dataset.size === 'mobile'); }));
  </script>
</body>
</html>
