services:
  team4sv30-backend:
    ports: !override
      - "18092:8092"
    environment:
      KEYCLOAK_ISSUER_URL: http://127.0.0.1:18081/realms/team4s
      KEYCLOAK_ACCOUNT_URL: http://127.0.0.1:18081/realms/team4s/account
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:18092
  team4sv30-frontend:
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18092
      NEXT_PUBLIC_KEYCLOAK_BASE_URL: http://127.0.0.1:18081
  keycloak:
    ports: !override
      - "18081:8080"
