feature: episode-versioning
endpoints:
  - name: grouped-episodes-list
    method: GET
    path: /api/v1/anime/:animeId/episodes
    path_params:
      - name: animeId
        type: int64
        minimum: 1
    response:
      status: 200
      type: GroupedEpisodesResponse

  - name: episode-version-get
    method: GET
    path: /api/v1/episode-versions/:versionId
    path_params:
      - name: versionId
        type: int64
        minimum: 1
    response:
      status: 200
      type: EpisodeVersionResponse

  - name: episode-version-editor-context
    method: GET
    path: /api/v1/admin/episode-versions/:versionId/editor-context
    auth:
      required: true
      permission: platform_admin or release_version.view/media/notes capability for a related fansub group
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: versionId
        type: int64
        minimum: 1
    response:
      status: 200
      type: EpisodeVersionEditorContextResponse

  - name: episode-version-folder-scan
    method: POST
    path: /api/v1/admin/episode-versions/:versionId/folder-scan
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: versionId
        type: int64
        minimum: 1
    response:
      status: 200
      type: EpisodeVersionFolderScanResponse

  - name: episode-version-create
    method: POST
    path: /api/v1/anime/:animeId/episodes/:episodeNumber/versions
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: animeId
        type: int64
        minimum: 1
      - name: episodeNumber
        type: int32
        minimum: 1
    request_body:
      required: true
      type: EpisodeVersionCreateRequest
    response:
      status: 201
      type: EpisodeVersionResponse

  - name: episode-version-update
    method: PATCH
    path: /api/v1/episode-versions/:versionId
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: versionId
        type: int64
        minimum: 1
    request_body:
      required: true
      type: EpisodeVersionPatchRequest
    response:
      status: 200
      type: EpisodeVersionResponse

  - name: episode-version-delete
    method: DELETE
    path: /api/v1/episode-versions/:versionId
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: versionId
        type: int64
        minimum: 1
    response:
      status: 204
      type: none

  - name: release-stream-proxy
    method: GET
    path: /api/v1/release-versions/:id/playback-access
    auth:
      required: true
    cache_control: private, no-store
    response:
      status: 200
      type: ReleasePlaybackAccessResponse

  - name: release-stream-proxy
    method: POST
    path: /api/v1/releases/:id/grant
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: id
        type: int64
        minimum: 1
    response:
      status: 201
      type: ReleaseStreamGrantResponse

  - name: release-stream-proxy
    method: GET
    path: /api/v1/releases/:id/stream
    path_params:
      - name: id
        type: int64
        minimum: 1
    query_params:
      - name: grant
        type: string
        description: Required short-lived signed stream grant token; entitlement is rechecked on use.
    response:
      status: 200
      type: binary-stream

  - name: segment-stream-proxy
    method: POST
    path: /api/v1/segments/:id/grant
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      notes:
        - Grants are issued for a theme segment id, not for arbitrary start/end query parameters.
        - Any authenticated app session may request an eligible public, ready segment.
        - The requested release_version_id must match the segment's persisted release-version source.
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
    path_params:
      - name: id
        type: int64
        minimum: 1
    query_params:
      - name: release_version_id
        type: int64
        minimum: 1
        required: true
    response:
      status: 201
      type: SegmentStreamGrantResponse

  - name: segment-render
    method: POST
    path: /api/v1/segments/:id/render
    auth:
      required: true
      header:
        name: Authorization
        format: Bearer <signed token>
      notes:
        - Prepares a server-side bounded preview artifact for a persisted theme segment id.
        - Non-admin users need release_version.segments.manage for the segment release-version context.
      unauthenticated_status: 401
      unauthenticated_response:
        error:
          message: "anmeldung erforderlich"
      forbidden_status: 403
      forbidden_response:
        error:
          message: "keine berechtigung"
    path_params:
      - name: id
        type: int64
        minimum: 1
    response:
      status: 200
      type: SegmentRenderCacheResponse

  - name: segment-stream-proxy
    method: GET
    path: /api/v1/segments/:id/stream
    notes:
      - Streams only the server-side bounded segment artifact or explicit uploaded fallback for the theme segment id.
      - Free-form start/end/duration/startTimeTicks query parameters are rejected.
    path_params:
      - name: id
        type: int64
        minimum: 1
    query_params:
      - name: grant
        type: string
        required: true
        description: Short-lived signed segment stream grant token issued by /api/v1/segments/:id/grant.
    response:
      status: 200
      type: binary-stream

  - name: media-image-proxy
    method: GET
    path: /api/v1/media/image
    query_params:
      - name: provider
        type: string
      - name: item_id
        type: string
      - name: kind
        type: string
        enum: [primary, backdrop, logo, thumb]
      - name: width
        type: int32
      - name: quality
        type: int32
      - name: index
        type: int32
        minimum: 0
        description: Optional backdrop index for Jellyfin multi-fanart rotation (fanart, fanart1...).
    response:
      status: 200
      type: binary-image

  - name: media-video-proxy
    method: GET
    path: /api/v1/media/video
    query_params:
      - name: provider
        type: string
      - name: item_id
        type: string
    response:
      status: 200
      type: binary-stream

types:
  ReleasePlaybackAccessResponse:
    data:
      can_play: bool
      stream_ready: bool
  SubtitleType:
    enum: [hardsub, softsub]
  GroupedEpisodesResponse:
    anime_id: int64
    episodes: GroupedEpisode[]
  PublicReleaseDetail:
    release_version_id: int64
    episode_number: string
    episode_title: string | null
    title: string
    version: string
    groups: PublicReleaseGroup[]
    release_date: datetime | null
    duration_seconds: int32 | null
    resolution: string | null
    container: string | null
    video_codec: string | null
    audio_codec: string | null
    audio_language: string | null
    subtitle_tracks: PublicReleaseSubtitleTrack[]
    preview_image: PublicReleaseImage | null
    image_category_totals: PublicReleaseImageCategoryTotals
    contributors: PublicReleaseContributor[]
    images: PublicReleaseImage[]
    notes: PublicReleaseNote[]
    segments: PublicReleaseSegment[]
    previous: PublicReleaseNavigationTarget | null
    next: PublicReleaseNavigationTarget | null
  PublicReleaseGroup:
    id: int64
    slug: string
    name: string
    logo_url: string | null
  PublicReleaseSubtitleTrack:
    language: string | null
    label: string
    format: string | null
    forced: bool
    default: bool
  PublicReleaseImageCategoryTotals:
    screenshot: int64
    typesetting_karaoke: int64
    fun_outtake: int64
    other: int64
  EpisodeVersionResponse:
    data: EpisodeVersion
  EpisodeVersionEditorContextResponse:
    data: EpisodeVersionEditorContext
  EpisodeVersionFolderScanResponse:
    data: EpisodeVersionFolderScanResult
  ReleaseStreamGrantResponse:
    data: ReleaseStreamGrant
  SegmentStreamGrantResponse:
    data: SegmentStreamGrant
  SegmentRenderCacheResponse:
    data: SegmentRenderCache
  GroupedEpisode:
    episode_number: int32
    episode_title: string | null
    default_version_id: int64 | null
    version_count: int32
    versions: EpisodeVersion[]
  EpisodeVersion:
    id: int64
    anime_id: int64
    episode_number: int32
    title: string | null
    fansub_groups: FansubGroupShort[]
    media_provider: string
    media_item_id: string
    video_quality: string | null
    subtitle_type: SubtitleType | null
    release_date: datetime | null
    crc32: string | null
    stream_url: string | null
    created_at: datetime
    updated_at: datetime
  EpisodeVersionEditorContext:
    version: EpisodeVersion
    anime_title: string
    anime_folder_path: string | null
    selected_groups: FansubGroupShort[]
  EpisodeVersionFolderScanResult:
    version_id: int64
    anime_id: int64
    anime_folder_path: string | null
    files: EpisodeVersionMediaFile[]
  EpisodeVersionMediaFile:
    file_name: string
    path: string
    media_item_id: string
    stream_url: string | null
    video_quality: string | null
    file_size_bytes: int64 | null
    last_modified: datetime | null
    detected_episode_number: int32 | null
    release_name: string | null
  ReleaseStreamGrant:
    release_id: int64
    grant_token: string
    expires_at: int64
    ttl_seconds: int64
    issued_for: int64
  SegmentStreamGrant:
    theme_segment_id: int64
    grant_token: string
    expires_at: int64
    ttl_seconds: int64
    issued_for: int64
  SegmentRenderCache:
    id: int64
    theme_segment_id: int64
    playback_source_id: int64 | null
    cache_key: string
    source_kind: string
    source_fingerprint: string
    render_profile: string
    status: queued | rendering | ready | failed | stale
    output_path: string | null
    mime_type: string | null
    duration_seconds: int32 | null
    video_codec: string | null
    audio_codec: string | null
    subtitle_stream_index: int32 | null
    subtitle_codec: string | null
    error_code: string | null
    error_message: string | null
    attempts: int32
    queued_at: datetime
    started_at: datetime | null
    completed_at: datetime | null
    invalidated_at: datetime | null
    created_at: datetime
    updated_at: datetime
  EpisodeVersionCreateRequest:
    title: string | null
    fansub_group_id: int64 | null
    media_provider: string (required, min: 1, max: 30)
    media_item_id: string (required, min: 1, max: 120)
    video_quality: string | null
    subtitle_type: SubtitleType | null
    release_date: datetime | null
    crc32: string | null (8 uppercase hex characters)
    stream_url: string | null
  EpisodeVersionPatchRequest:
    title: string | null
    fansub_group_id: int64 | null
    media_provider: string (optional, min: 1, max: 30)
    media_item_id: string (optional, min: 1, max: 120)
    video_quality: string | null
    subtitle_type: SubtitleType | null
    release_date: datetime | null
    crc32: string | null (8 uppercase hex characters)
    stream_url: string | null
  FansubGroupShort:
    id: int64
    slug: string
    name: string
    logo_url: string | null
