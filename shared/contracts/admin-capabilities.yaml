openapi: 3.0.3
info:
  title: Team4s Admin Capability Management API
  version: 0.1.0
  description: |
    OpenAPI-Contract für die Capability-Pflege-Endpunkte (Phase 87, D-08).
    Alle Endpunkte erfordern einen gültigen Platform-Admin-Bearer-Token.
servers:
  - url: /
    description: Relativer API-Basispfad
tags:
  - name: AdminCapabilities
    description: Capability-Matrix-Verwaltung für Rollen (nur Platform-Admin).
security:
  - bearerAuth: []
paths:
  /api/v1/admin/fansubs/{id}/capabilities:
    get:
      tags: [AdminCapabilities]
      summary: Berechtigungen für den Fansubgruppen-Arbeitsbereich abrufen
      operationId: getFansubGroupCapabilities
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Berechtigungen für den Fansubgruppen-Arbeitsbereich
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FansubGroupCapabilitiesResponse"
        "400":
          description: Ungültige Fansubgruppen-ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/role-definitions:
    get:
      summary: Öffentlichen Rollen-Präsentationskatalog abrufen
      security: []
      parameters:
        - in: query
          name: context
          required: true
          schema:
            type: string
            enum: [fansub_group, anime_contribution, group_history]
      responses:
        "200":
          description: Präsentationsdaten ohne Autorisierungsdetails
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleDefinitionOption" }
  /api/v1/admin/role-capabilities:
    get:
      tags: [AdminCapabilities]
      summary: Capability-Matrix abrufen
      description: |
        Gibt alle Rollen mit ihren gewährten Capabilities aus role_capabilities zurück.
        Nur für Platform-Admins zugänglich (D-03).
      operationId: getRoleCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Capability-Matrix erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCapabilityMatrix"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/role-holders/{roleCode}:
    get:
      tags: [AdminCapabilities]
      summary: Rolleninhaber abrufen (D-07)
      description: |
        Gibt alle gruppen-skopierten Inhaber einer echten `role_definitions`-Gruppenrolle
        zurück (z. B. fansub_lead, co_leader, encoder), inklusive Gruppenzuordnung,
        Mitgliedsstatus und Rechte-Abweichungs-Signal (has_overrides). Globale App-Rollen
        (platform_admin/content_admin/user) sind hier NICHT unterstützt — sie haben bereits
        eine Antwort über `/admin/users?role=<code>`. Nur für Platform-Admins zugänglich
        (D-08-Muster, wie /admin/role-capabilities).
      operationId: listRoleHolders
      security:
        - bearerAuth: []
      parameters:
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rolleninhaber erfolgreich abgerufen
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleHolderEntry"
        "400":
          description: Unbekannter oder nicht gruppen-skopierter Rollen-Code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/claims:
    get:
      tags: [AdminCapabilities]
      summary: Zentrale, gruppenuebergreifende Claims-Arbeitsqueue abrufen (D-23)
      description: |
        Gibt member_claims ueber ALLE Fansub-Gruppen gefiltert und paginiert zurueck.
        Anders als die bestehende gruppen-delegierbare
        GET /admin/fansubs/{id}/member-claims (nur pending, nur eine Gruppe) ist dies
        eine gruppenuebergreifende Aggregation und deshalb strenger geschuetzt:
        ausschliesslich Platform-Admins (D-08-Muster, wie /admin/role-holders).
        Es werden ausschliesslich reale, im Code bestehende claim_status-Werte
        (pending/verified/rejected) verwendet — keine erfundenen Kategorien.
      operationId: listAdminClaims
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, rejected]
        - name: claim_type
          in: query
          required: false
          description: >
            Vorwaerts-kompatibler Filter; heute existiert nur der literale Wert "claim"
            (kein claim_type-Spaltenwert auf member_claims).
          schema:
            type: string
        - name: fansub_group_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: app_user_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Claims-Liste erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaimsListResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/changes:
    get:
      tags: [AdminCapabilities]
      summary: Zentrale, gruppenuebergreifende Aenderungen/Audit-Arbeitsqueue abrufen (D-25/D-28)
      description: |
        Gibt audit_logs ueber ALLE Fansub-Gruppen/User gefiltert und paginiert zurueck.
        Anders als die bestehende, in den User-Detail-Drawer eingebettete
        GET /admin/users/{userId}/audit (ein einzelner User) ist dies eine
        gruppenuebergreifende Aggregation und deshalb strenger geschuetzt:
        ausschliesslich Platform-Admins (D-08-Muster, wie /admin/role-holders).
        rolle/capability/claim-Filter existieren NICHT als eigene Spalten auf
        audit_logs — nur target_type (z. B. role_capability,
        user_group_capability_override, member_claim) ist filterbar; die
        payload-JSONB-Spalte wird von diesem Endpunkt nicht interpretiert.
      operationId: listAdminChanges
      security:
        - bearerAuth: []
      parameters:
        - name: benutzer
          in: query
          required: false
          description: >
            app_users.id — matched gegen actor_app_user_id ODER
            (target_type = 'app_user' AND target_id = benutzer), spiegelt
            GetUserAudit's bestehende OR-Semantik.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: akteur
          in: query
          required: false
          description: app_users.id — matched ausschliesslich gegen actor_app_user_id.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: gruppe
          in: query
          required: false
          description: fansub_groups.id — matched gegen scope_type = 'group' AND scope_id.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: target_type
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inklusive untere Grenze (created_at >= from).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inklusive obere Grenze (created_at <= to).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Aenderungen-Liste erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChangesListResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/role-capabilities/{roleCode}/{actionCode}:
    put:
      tags: [AdminCapabilities]
      summary: Capability einer Rolle gewähren
      description: |
        Gewährt einer Rolle eine Capability (action_code in role_capabilities eintragen).
        Nur für Platform-Admins zugänglich (D-03). Nach erfolgreichem Schreiben wird
        der Permissions-Cache neu geladen (D-06). Auditierbar (D-06).
      operationId: grantCapability
      security:
        - bearerAuth: []
      parameters:
        - name: roleCode
          in: path
          required: true
          description: Rollen-Code (z. B. fansub_lead, editor)
          schema:
            type: string
        - name: actionCode
          in: path
          required: true
          description: Action-Code (z. B. fansub_group.members.view)
          schema:
            type: string
      responses:
        "200":
          description: Capability erfolgreich gewährt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCapabilityMutationResult"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rollen-Code oder Action-Code nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Lockout-Guard ausgelöst — Capability kann nicht entzogen werden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockoutErrorResponse"
        "422":
          description: Rolle ist nicht zuweisbar (historische Gruppenrolle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [AdminCapabilities]
      summary: Capability einer Rolle entziehen
      description: |
        Entzieht einer Rolle eine Capability (action_code aus role_capabilities entfernen).
        Nur für Platform-Admins zugänglich (D-03). Lockout-Guard (D-07): kritische Capabilities
        können nicht so entzogen werden, dass sich alle Admins aussperren.
        Nach erfolgreichem Schreiben wird der Permissions-Cache neu geladen (D-06). Auditierbar (D-06).
      operationId: revokeCapability
      security:
        - bearerAuth: []
      parameters:
        - name: roleCode
          in: path
          required: true
          description: Rollen-Code (z. B. fansub_lead, editor)
          schema:
            type: string
        - name: actionCode
          in: path
          required: true
          description: Action-Code (z. B. fansub_group.members.view)
          schema:
            type: string
      responses:
        "200":
          description: Capability erfolgreich entzogen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCapabilityMutationResult"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rollen-Code oder Action-Code nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Lockout-Guard ausgelöst — letzte Capability darf nicht entzogen werden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockoutErrorResponse"
        "422":
          description: Rolle ist nicht zuweisbar (historische Gruppenrolle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/role-capabilities/{roleCode}/{actionCode}/impact-preview:
    get:
      tags: [AdminCapabilities]
      summary: Vorschau der Rechte-Auswirkung einer Rolle-zu-Capability-Änderung (CAP-09)
      description: |
        Phase 138 Plan 07 (CAP-09): berechnet einen vollständigen before/after-Diff der
        effektiven Rechte für JEDEN aktuellen Inhaber von roleCode, über alle Gruppen, in
        denen er die Rolle hält, für eine hypothetische Gewährung (add=true) oder Entziehung
        (add=false) von actionCode auf dieser Rolle — das "eine Aktion, viele Personen"-
        Gegenstück zur "eine Person, viele Aktionen"-Vorschau unter
        .../app-members/{appUserId}/role-assignment-impact. Ausschließlich lesend, ohne
        Nebenwirkung: es wird nichts persistiert. Wiederverwendet exakt denselben
        Präzedenz-Evaluator wie ResolveGroupRights (D-20, bindend) — kein zweiter,
        unabhängig berechneter Entscheidungspfad. Autorisierung spiegelt exakt die
        bestehende Capability-Mutation (PUT/DELETE .../role-capabilities/{roleCode}/
        {actionCode}) wider, damit ein Admin ohne Mutationsrecht auch keine Vorschau sehen kann.
      operationId: previewCapabilityChange
      security:
        - bearerAuth: []
      parameters:
        - name: roleCode
          in: path
          required: true
          description: Rollen-Code (z. B. fansub_lead, editor)
          schema:
            type: string
        - name: actionCode
          in: path
          required: true
          description: Action-Code (z. B. fansub_group.members.view)
          schema:
            type: string
        - name: add
          in: query
          required: true
          description: >
            true = hypothetische Gewährung von actionCode an roleCode vorschauen,
            false = hypothetische Entziehung vorschauen.
          schema:
            type: boolean
      responses:
        "200":
          description: Before/After-Diff der effektiven Rechte für jeden aktuellen Rolleninhaber
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CapabilityOverrideImpactPreview" }
        "400":
          description: roleCode/actionCode fehlen oder ungültiger/fehlender add-Parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Platform-Admin-Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Rolle ist nicht zuweisbar (historische Gruppenrolle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/fansubs/{id}/app-members/{appUserId}/effective-rights:
    get:
      tags: [AdminCapabilities]
      summary: Vollständige effektive Rechte eines Gruppenmitglieds abrufen
      description: |
        Phase 137 (D01-D04, D08): projiziert exakt eine ResolveGroupRights-Auflösung
        für das Zielmitglied in genau dieser Fansub-Gruppe — keine zweite,
        unabhängig berechnete Entscheidung. Autorisiert über die dedizierte
        Verwaltungs-Capability user_group_capability_override.manage (D07).
        Fremde Gruppen-/User-Kombinationen liefern neutral 404 (D08).
      operationId: getEffectiveRights
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Fansub-Gruppe (autorisierender Scope)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: appUserId
          in: path
          required: true
          description: app_users.id des Zielmitglieds
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Vollständige effektive-Rechte-Liste für das Zielmitglied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveRightState" }
        "400":
          description: Ungültige Fansubgruppen-ID oder ungültige app_user_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Keine Berechtigung für diese Gruppe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Mitgliedschaftseintrag nicht gefunden (auch bei fremder Gruppe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/fansubs/{id}/app-members/{appUserId}/role-assignment-impact:
    get:
      tags: [AdminCapabilities]
      summary: Vorschau der Rechte-Auswirkung einer Rollenzuweisung/-entziehung
      description: |
        Phase 138 (D-22, CAP-09): berechnet einen vollständigen before/after-Diff der
        effektiven Rechte für EIN Zielmitglied über ALLE Aktionen, für eine
        hypothetische Rollenzuweisung (change=assign) oder -entziehung
        (change=revoke) — das "eine Person, viele Aktionen"-Gegenstück zu
        CAP-09s Rolle-zu-Capability-Vorschau ("eine Aktion, viele Personen").
        Ausschließlich lesend, ohne Nebenwirkung: es wird nichts persistiert.
        Wiederverwendet exakt denselben Präzedenz-Evaluator wie ResolveGroupRights
        (D-20, bindend) — kein zweiter, unabhängig berechneter Entscheidungspfad.
        Autorisierung und Rollenvalidierung spiegeln exakt die bestehende
        Rollenzuweisungs-Mutation (PUT .../roles, ActionFansubGroupMembersManage)
        wider, damit ein Admin ohne Mutationsrecht auch keine Vorschau sehen kann.
        Fremde Gruppen-/User-Kombinationen liefern neutral 404 (analog D08).
      operationId: previewRoleAssignmentImpact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Fansub-Gruppe (autorisierender Scope)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: appUserId
          in: path
          required: true
          description: app_users.id des Zielmitglieds
          schema: { type: integer, format: int64, minimum: 1 }
        - name: role_code
          in: query
          required: true
          description: Gruppenrollen-Code (muss eine bekannte, zuweisbare Gruppenrolle sein)
          schema: { type: string }
        - name: change
          in: query
          required: true
          description: assign = hypothetisch hinzufügen, revoke = hypothetisch entziehen
          schema: { type: string, enum: [assign, revoke] }
      responses:
        "200":
          description: Before/After-Diff der effektiven Rechte für das Zielmitglied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RoleAssignmentImpactPreview" }
        "400":
          description: Ungültige Fansubgruppen-ID, ungültige app_user_id, unbekannte Rolle oder ungültiger change-Wert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Keine Berechtigung für diese Gruppe (identisch zur Rollenzuweisungs-Mutation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Mitgliedschaftseintrag nicht gefunden (auch bei fremder Gruppe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/fansubs/{id}/historical-members/{memberId}/claim-activation-impact:
    get:
      tags: [AdminCapabilities]
      summary: Vorschau der Rechte-Auswirkung der Claim-Aktivierung (ActivateClaimedMember)
      description: |
        Phase 138 (D-24): berechnet einen vollständigen before/after-Diff der
        effektiven Rechte für EIN historisches Mitglied über ALLE Aktionen, für
        die reale ActivateClaimedMember-Aktivierung — die EINE Claim-Entscheidung,
        die tatsächlich eine Mitgliedschaft plus Rollen anlegt. VerifyClaim/
        RejectClaim ändern nachweislich keine effektiven Rechte und erhalten
        deshalb absichtlich KEINE Vorschau (D-24, bindende Ehrlichkeitsregel).
        Ausschließlich lesend, ohne Nebenwirkung: es wird nichts persistiert.
        Wiederverwendet exakt denselben Präzedenz-Evaluator wie ResolveGroupRights
        (D-20, bindend) — kein zweiter, unabhängig berechneter Entscheidungspfad.
        Autorisierung spiegelt exakt dieselbe Aktion (ActionFansubGroupHistoricalMembersLink)
        wider, die VerifyClaim/ActivateClaimedMember bereits verlangen.
      operationId: previewClaimActivationImpact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Fansub-Gruppe (autorisierender Scope)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: memberId
          in: path
          required: true
          description: members.id des historischen Mitglieds
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Before/After-Diff der effektiven Rechte für die reale Aktivierung
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ClaimActivationImpactPreview" }
        "400":
          description: Ungültige Fansubgruppen-ID oder ungültige member-id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Keine Berechtigung für diese Gruppe (identisch zur echten Aktivierung)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Kein verifizierter Claim für dieses Mitglied gefunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Keine übernehmbaren Rollen dokumentiert (mirrors ActivateClaimedMember's no_activatable_roles)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/fansubs/{id}/app-members/{appUserId}/capability-overrides:
    put:
      tags: [AdminCapabilities]
      summary: Persönlichen Gruppen-Capability-Override setzen oder entfernen
      description: |
        Phase 137 (D06-D08): führt genau eine der drei logischen Operationen
        SET ALLOW / SET DENY / REMOVE aus (effect=allow|deny|null) und delegiert
        vollständig an EffectiveRightsService.MutateOverride (137-06). group_id
        und target_user_id im Body müssen exakt mit den Pfad-Parametern
        übereinstimmen — eine Abweichung wird vor jeder Domänen-Mutation mit
        422 abgelehnt (D08).
      operationId: mutateEffectiveRightsOverride
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Fansub-Gruppe (autorisierender Scope)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: appUserId
          in: path
          required: true
          description: app_users.id des Zielmitglieds
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityOverrideMutationRequest" }
      responses:
        "200":
          description: Mutation angewendet (changed oder no_op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/CapabilityOverrideMutationResult" }
        "400":
          description: Ungültiger Request-Body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Keine Verwaltungsberechtigung für diese Gruppe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: >
            group_id/target_user_id stimmen nicht mit dem Pfad überein, Zielmitglied
            ist keine aktive Mitgliedschaft, Action unbekannt/nicht überschreibbar,
            oder ein Grund fehlt für eine echte Änderung.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/fansubs/{id}/app-members/{appUserId}/capability-overrides/history:
    get:
      tags: [AdminCapabilities]
      summary: Unveränderliche Override-Historie eines Gruppenmitglieds abrufen
      description: |
        Phase 137 (D06, D08): listet append-only Übergangs-Datensätze, strikt
        auf (target_user_id, group_id) beschränkt. Fremde Kombinationen liefern
        eine leere Liste statt eines abweichenden Statuscodes (kein Enumerations-Orakel).
      operationId: listEffectiveRightsOverrideHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Fansub-Gruppe (autorisierender Scope)
          schema: { type: integer, format: int64, minimum: 1 }
        - name: appUserId
          in: path
          required: true
          description: app_users.id des Zielmitglieds
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Override-Historie (neueste zuerst)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityOverrideAuditItem" }
        "400":
          description: Ungültige Fansubgruppen-ID oder ungültige app_user_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Keine Berechtigung für diese Gruppe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/fansubs/{fansubId}/role-definitions:
    get:
      tags: [AdminCapabilities]
      summary: Rollenliste für historische Mitgliedsfunktionen abrufen
      description: |
        Gibt Rollendefinitionen für historische Mitgliedsfunktionen zurück:
        Rollen wie Übersetzung, Timing, Typesetting, Editing, Encoding,
        Raw-Bereitstellung, Qualitätsprüfung und Design dokumentieren Archivdaten
        und vergeben keine aktiven App-Rechte.
        Nur für berechtigte Akteure zugänglich (CanForFansubGroup.MembersView).
      operationId: listGroupHistoryRoleDefinitions
      security:
        - bearerAuth: []
      parameters:
        - name: fansubId
          in: path
          required: true
          description: ID der Fansub-Gruppe
          schema:
            type: integer
        - name: context
          in: query
          required: false
          description: Kontext-Filter (z. B. group_history)
          schema:
            type: string
      responses:
        "200":
          description: Kuratierte Rollenliste erfolgreich abgerufen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleDefinitionOption"
        "401":
          description: Nicht authentifiziert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Keine Berechtigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Platform-Admin-Bearer-Token (requirePlatformAdmin-Gate)
  schemas:
    FansubGroupCapabilities:
      type: object
      required:
        - can_edit_group
        - can_edit_group_general
        - can_edit_technical_links
        - can_edit_founding_history
        - can_update_group_links
        - can_manage_links
        - can_view_members
        - can_manage_members
        - can_manage_historical_members
        - can_manage_historical_roles
        - can_link_historical_members
        - can_edit_notes
        - can_view_invitations
        - can_create_invitation
        - can_cancel_invitation
        - can_view_releases
        - can_view_release_media
        - can_upload_release_media
        - can_edit_release_notes
        - can_view_group_media
        - can_upload_group_media
        - can_update_group_media
        - can_delete_own_group_media
        - can_delete_group_media
        - can_reorder_group_media
      properties:
        can_edit_group:
          type: boolean
        can_edit_group_general:
          type: boolean
        can_edit_technical_links:
          type: boolean
        can_edit_founding_history:
          type: boolean
        can_update_group_links:
          type: boolean
        can_manage_links:
          type: boolean
        can_view_members:
          type: boolean
        can_manage_members:
          type: boolean
        can_manage_historical_members:
          type: boolean
        can_manage_historical_roles:
          type: boolean
        can_link_historical_members:
          type: boolean
        can_edit_notes:
          type: boolean
        can_view_invitations:
          type: boolean
        can_create_invitation:
          type: boolean
        can_cancel_invitation:
          type: boolean
        can_view_releases:
          type: boolean
        can_view_release_media:
          type: boolean
        can_upload_release_media:
          type: boolean
        can_edit_release_notes:
          type: boolean
        can_view_group_media:
          type: boolean
        can_upload_group_media:
          type: boolean
        can_update_group_media:
          type: boolean
        can_delete_own_group_media:
          type: boolean
        can_delete_group_media:
          type: boolean
        can_reorder_group_media:
          type: boolean
    FansubGroupCapabilitiesResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FansubGroupCapabilities"
    EffectiveRightProvenance:
      type: string
      description: |
        Herkunfts-/Entscheidungsquellen-Vokabular für ein EffectiveRightState.
        platform_admin, specialized_grant und no_grant wurden additiv in Phase 137
        ergänzt (D04); die ursprünglichen vier Phase-136-Werte bleiben unverändert
        gültig und werden nicht entfernt.
      enum: [idp_global_role, group_role, user_allow, user_deny, platform_admin, specialized_grant, no_grant]
    CapabilityOverrideEffect:
      type: string
      enum: [allow, deny]
    CapabilityActivationStatus:
      type: string
      description: |
        "active" ist der normale erfolgreiche Mutationspfad. MutateOverride meldet
        "pending", wenn nach einem bereits erfolgreich committeten Override-Write
        die nachgelagerte Anreicherung (Ziel-Actor- bzw. Effective-Rights-
        Neuauflösung) fehlschlägt -- der Write selbst bleibt dabei unverändert
        erfolgreich, nur die Response-Anreicherung ist unvollständig. "persisted"
        und "failed" bleiben schema-kompatibel für spätere Phasen (z. B.
        Cache-Aktivierungsmodelle) und werden von Phase 137 nicht erzeugt.
      enum: [persisted, active, pending, failed]
    CapabilityMutationStatus:
      type: string
      enum: [changed, no_op]
    EffectiveRightState:
      type: object
      description: |
        Additiv erweitertes Phase-136-DTO (Phase 137, D04): ein einziges
        provenienzfähiges Effective-Right-Kontrakt statt eines konkurrierenden,
        reicheren Inspector-DTOs. Dient sowohl Mutationsergebnissen als auch der
        künftigen Effective-Rights-Inspection.
      required:
        [action_code, allowed, provenance, decisive, non_deniable, granting_roles,
         user_allow, user_deny, specialized_grants, decisive_source, reason_code]
      properties:
        action_code: { type: string }
        allowed: { type: boolean }
        provenance: { $ref: "#/components/schemas/EffectiveRightProvenance" }
        decisive: { type: boolean }
        non_deniable:
          type: boolean
          description: Für IdP-eigene globale Rechte wahr; Gruppen-Overrides dürfen dieses Recht nicht verweigern.
        granting_roles:
          type: array
          items: { type: string }
          description: Alle Rollen, die diese Capability gewähren würden (unabhängig davon, ob sie das entscheidende Ergebnis liefern).
        user_allow:
          type: boolean
          description: Ob ein individueller Allow-Override für diese Capability existiert.
        user_deny:
          type: boolean
          description: Ob ein individueller Deny-Override für diese Capability existiert.
        specialized_grants:
          type: array
          items: { type: string }
          description: Namen spezialisierter Grant-Quellen (z. B. review_delegation), die diese Capability gewähren würden.
        decisive_source:
          allOf: [{ $ref: "#/components/schemas/EffectiveRightProvenance" }]
          description: Die gemäß Präzedenz tatsächlich entscheidende Quelle für das Ergebnis "allowed".
        reason_code:
          type: string
          description: Maschinenlesbarer Grund-Code für das Ergebnis; enthält bewusst keinen deutschsprachigen Erklärtext (Phase 137 Scope).
    RoleAssignmentImpactPreview:
      type: object
      description: |
        Phase 138 (D-22, CAP-09): vollständiger before/after-Diff der effektiven Rechte
        eines Zielmitglieds über alle Aktionen für eine hypothetische
        Rollenzuweisung/-entziehung. before/after nutzen exakt dasselbe
        EffectiveRightState-Schema wie die Effective-Rights-Inspection — keine
        zweite, konkurrierende Projektion.
      required: [target_user_id, role_code, change, before, after]
      properties:
        target_user_id: { type: integer, format: int64 }
        role_code: { type: string }
        change:
          type: string
          enum: [assign, revoke]
        before:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRightState" }
        after:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRightState" }
    ClaimActivationImpactPreview:
      type: object
      description: |
        Phase 138 (D-24): vollständiger before/after-Diff der effektiven Rechte eines
        historischen Mitglieds über alle Aktionen für die reale ActivateClaimedMember-
        Aktivierung. RoleAssignmentImpactPreview passt hier nicht — mehrere Rollen
        aktivieren sich gleichzeitig, und die Mitgliedschaft selbst (nicht ein einzelner
        role_code) ist die Änderung. before/after nutzen exakt dasselbe
        EffectiveRightState-Schema wie die Effective-Rights-Inspection — keine zweite,
        konkurrierende Projektion.
      required: [target_app_user_id, role_codes, before, after]
      properties:
        target_app_user_id: { type: integer, format: int64 }
        role_codes:
          type: array
          items: { type: string }
        before:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRightState" }
        after:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRightState" }
    CapabilityOverrideReason:
      oneOf:
        - type: object
          required: [category]
          properties:
            category:
              type: string
              enum: [task_delegation, security_measure, role_gap]
            text: { type: string, nullable: true }
        - type: object
          required: [category, text]
          properties:
            category:
              type: string
              enum: [other]
            text: { type: string, minLength: 1 }
    CapabilityOverrideState:
      type: object
      required: [group_id, target_user_id, action_code, effect, reason, created_by_user_id, created_at]
      properties:
        group_id: { type: integer, format: int64 }
        target_user_id: { type: integer, format: int64 }
        action_code: { type: string }
        effect: { $ref: "#/components/schemas/CapabilityOverrideEffect" }
        reason: { $ref: "#/components/schemas/CapabilityOverrideReason" }
        created_by_user_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    CapabilityOverrideImpactItem:
      type: object
      required: [target_user_id, before, after]
      properties:
        target_user_id: { type: integer, format: int64 }
        before: { $ref: "#/components/schemas/EffectiveRightState" }
        after: { $ref: "#/components/schemas/EffectiveRightState" }
    CapabilityOverrideImpactPreview:
      type: object
      required: [affected_user_count, items]
      properties:
        affected_user_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/CapabilityOverrideImpactItem" }
    CapabilityOverrideAuditItem:
      type: object
      required: [id, group_id, target_user_id, action_code, actor_user_id, occurred_at, before, after, reason]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64 }
        target_user_id: { type: integer, format: int64 }
        action_code: { type: string }
        actor_user_id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        before:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideState" }]
          nullable: true
        after:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideState" }]
          nullable: true
        reason:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideReason" }]
          nullable: true
    CapabilityOverrideMutationResult:
      type: object
      required: [status, changed, before, after, effective_right, activation_status]
      properties:
        status: { $ref: "#/components/schemas/CapabilityMutationStatus" }
        changed:
          type: boolean
          description: Falsch bei einer exakt idempotenten Wiederholung; dafür entsteht kein weiterer Domain-Audit-Eintrag.
        before:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideState" }]
          nullable: true
        after:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideState" }]
          nullable: true
        effective_right: { $ref: "#/components/schemas/EffectiveRightState" }
        activation_status: { $ref: "#/components/schemas/CapabilityActivationStatus" }
    CapabilityOverrideMutationRequest:
      type: object
      description: |
        External mutation request. Platform-admin provenance is derived from the
        authenticated server identity and can never be asserted by this payload.
        The server requires reason for non-platform administrators; authenticated
        platform administrators may omit it.
      required: [group_id, target_user_id, action_code, effect]
      properties:
        group_id: { type: integer, format: int64 }
        target_user_id: { type: integer, format: int64 }
        action_code: { type: string }
        effect: { $ref: "#/components/schemas/CapabilityOverrideEffect", nullable: true }
        reason:
          allOf: [{ $ref: "#/components/schemas/CapabilityOverrideReason" }]
          nullable: true
    RoleActionState:
      type: object
      required: [code, label_de, category, sort_order, description_de, help_text_de, user_overridable, granted, standalone]
      properties:
        code:
          type: string
          description: Action-Code (z. B. fansub_group.members.view)
        label_de:
          type: string
          description: Deutscher Anzeigename der Action
        category:
          type: string
          description: Kategorie-Gruppe der Action (z. B. Mitglieder, Releases)
        sort_order: { type: integer }
        description_de: { type: string, nullable: true }
        help_text_de: { type: string, nullable: true }
        user_overridable: { type: boolean }
        granted:
          type: boolean
          description: Ob diese Action der Rolle aktuell gewährt ist
        standalone:
          type: boolean
          description: Ob diese Action eine Standalone-Action ist (kein role_capabilities-Eintrag)
    RoleEntry:
      type: object
      required: [role_code, label_de, actions]
      properties:
        role_code:
          type: string
          description: Rollen-Code (z. B. fansub_lead)
        label_de:
          type: string
          description: Deutscher Anzeigename der Rolle
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RoleActionState"
        assignable:
          type: boolean
          description: "Ob die Rolle Capabilities erhalten darf (App-Gruppenrolle)."
        contexts:
          type: array
          items:
            type: string
          description: "role_definitions.contexts (für Kontext-Badges)."
        global_assignment_count:
          type: integer
          nullable: true
          description: >
            Anzahl aktiver Zuweisungen aus app_user_global_roles — nur für die drei
            synthetischen globalen App-Rollen-Zeilen (platform_admin/content_admin/user)
            gesetzt; für alle role_definitions-Zeilen null/fehlend (111-RESEARCH.md Pitfall 1).
        role_kind:
          type: string
          description: >
            "global_app_role" für die drei synthetischen globalen App-Rollen-Zeilen
            (platform_admin/content_admin/user), sonst leer/fehlend für role_definitions-Zeilen.
    RoleHolderEntry:
      type: object
      required:
        [
          app_user_id,
          display_name,
          email,
          fansub_group_id,
          fansub_group_name,
          membership_status,
          has_overrides,
        ]
      properties:
        app_user_id:
          type: integer
          format: int64
          description: app_users.id des Rolleninhabers
        display_name:
          type: string
          description: Anzeigename (display_name, sonst preferred_username, sonst email)
        email:
          type: string
          description: E-Mail-Adresse des Rolleninhabers
        fansub_group_id:
          type: integer
          format: int64
          description: fansub_groups.id der Gruppe, in der die Rolle gehalten wird
        fansub_group_name:
          type: string
          description: Name der Fansub-Gruppe
        membership_status:
          type: string
          description: Mitgliedsstatus in der Gruppe (z. B. active, disabled)
        has_overrides:
          type: boolean
          description: >
            Ob für (app_user_id, fansub_group_id) mindestens eine
            user_group_capability_overrides-Zeile existiert (Existenz-Signal, keine
            Einzel-Enumeration).
    ClaimListRow:
      type: object
      required:
        [
          claim_id,
          app_user_id,
          app_user_email,
          app_user_display_name,
          member_id,
          member_nickname,
          claim_status,
          claim_type,
          fansub_group_id,
          fansub_group_name,
          note,
          created_at,
        ]
      properties:
        claim_id:
          type: integer
          format: int64
          description: member_claims.id
        app_user_id:
          type: integer
          format: int64
          description: member_claims.app_user_id, 0 wenn kein App-User verknuepft ist
        app_user_email:
          type: string
          description: E-Mail-Adresse des verknuepften App-Users, leer wenn nicht verknuepft
        app_user_display_name:
          type: string
          description: Anzeigename (display_name, sonst preferred_username, sonst email)
        member_id:
          type: integer
          format: int64
          description: members.id
        member_nickname:
          type: string
          description: members.nickname
        claim_status:
          type: string
          enum: [pending, verified, rejected]
        claim_type:
          type: string
          description: >
            Heute immer der literale Wert "claim" — kein claim_type-Spaltenwert auf
            member_claims existiert.
        fansub_group_id:
          type: integer
          format: int64
          description: fansub_groups.id des Gruppenkontexts des Claims
        fansub_group_name:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
    AdminClaimsListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClaimListRow"
        meta:
          type: object
          required: [total, limit, offset]
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    ChangeListRow:
      type: object
      required:
        [
          event_id,
          event_type,
          target_type,
          action,
          outcome,
          occurred_at,
          scope_type,
        ]
      properties:
        event_id:
          type: integer
          format: int64
          description: audit_logs.id
        event_type:
          type: string
        target_type:
          type: string
        target_id:
          type: integer
          format: int64
          nullable: true
        action:
          type: string
          description: audit_logs.action_name
        outcome:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor_app_user_id:
          type: integer
          format: int64
          nullable: true
        scope_type:
          type: string
        scope_id:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          description: >
            Rohes audit_logs.payload-JSONB. Wird von diesem Endpunkt nicht
            interpretiert; eine spaetere Frontend-Uebersetzungsschicht liest
            bekannte Schluessel pro event_type.
          additionalProperties: true
    AdminChangesListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChangeListRow"
        meta:
          type: object
          required: [total, limit, offset]
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    ActionEntry:
      type: object
      required: [code, label_de, category, sort_order]
      properties:
        code:
          type: string
          description: Action-Code (z. B. release.view)
        label_de:
          type: string
          description: Deutscher Anzeigename der Action
        category:
          type: string
          description: Kategorie-Gruppe der Action
        sort_order:
          type: integer
          description: Sortierreihenfolge der Action innerhalb der Kategorie
    RoleCapabilityMatrix:
      type: object
      required: [roles, all_actions]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleEntry"
          description: Alle Rollen mit ihren gewährten Capabilities
        all_actions:
          type: array
          items:
            $ref: "#/components/schemas/ActionEntry"
          description: Alle bekannten Actions (für Spaltenüberschriften in der Matrix-Tabelle)
    RoleCapabilityMutationResult:
      type: object
      description: |
        Antwort-DTO für PUT/DELETE /admin/role-capabilities/{roleCode}/{actionCode}
        (Plan 138-02, CAP-10/D-21). Die Domänen-Mutation (Grant/Revoke) ist bei
        HTTP 200 immer erfolgreich; cache_reload_succeeded unterscheidet ehrlich
        zwischen "gespeichert und aktiv" und "gespeichert, aber der In-Process-
        Rechte-Cache konnte nicht neu geladen werden" (der alte Cache bleibt in
        letzterem Fall gültig — kein Datenverlust, nur eine Aktivierungs-
        verzögerung bis zum nächsten erfolgreichen Reload).
      required: [message, cache_reload_succeeded]
      properties:
        message:
          type: string
          example: "Capability erfolgreich zugewiesen."
        cache_reload_succeeded:
          type: boolean
          description: Ob der In-Process-Rechte-Cache nach der Mutation erfolgreich neu geladen wurde.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
    LockoutErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
              enum: [lockout_guard]
              description: Fehlercode lockout_guard signalisiert dem Client den Lockout-Guard
    AssignableErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
              enum: [role_not_assignable]
              description: Fehlercode role_not_assignable — Rolle ist eine historische Gruppenrolle und darf keine Capabilities erhalten oder verlieren.
    RoleDefinitionOption:
      type: object
      required: [code, label_de, contexts, sort_order, assignable, color_key, icon_key, operative_capability_count, has_operative_capabilities]
      properties:
        code:
          type: string
          description: Rollen-Code (z. B. founder, leader)
        label_de:
          type: string
          description: Deutscher Anzeigename der Rollendefinition
        sort_order:
          type: integer
          description: Sortierreihenfolge innerhalb der kuratierten Liste
        contexts:
          type: array
          items: { type: string }
        assignable: { type: boolean }
        color_key: { type: string }
        icon_key: { type: string }
        operative_capability_count: { type: integer }
        has_operative_capabilities: { type: boolean }
